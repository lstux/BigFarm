; BigFarm Cam — ESP32-CAM HW-297 (carte de la famille AI Thinker, à confirmer)
;
; Compiler :      pio run -d firmware/cam
; Flasher :       pio run -d firmware/cam -t upload
; Moniteur série : pio device monitor -d firmware/cam
;
; Avec l'adaptateur ESP32-CAM-MB : brancher en USB, flasher directement.
; Si le téléversement échoue, maintenir IO0 (bouton de l'adaptateur) au début du flash.

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino

; 4 Mo de Flash, deux emplacements d'application (OTA plus tard).
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    '-DBF_FW_VERSION="0.4.0"'
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

lib_deps =
    symlink://../common/BigFarmCore
lib_ldf_mode = chain+

; Mise à jour sans fil (OTA) depuis PlatformIO :
;   pio run -d firmware/cam -e esp32cam-ota -t upload --upload-port <nom>.local
; (ou l'adresse IP). Mot de passe : bigfarm-setup.
; Autre possibilité : page /maj du module, avec .pio/build/esp32cam/firmware.bin.
[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = bf-cam-9581b0.local
upload_flags =
    --auth=bigfarm-setup
    --port=3232
