; BigFarm Central — Guition ESP32-4848S040C_I_Y_V3 (ESP32-S3, écran 4" 480×480)
;
; Compiler :      pio run -d firmware/central
; Flasher :       pio run -d firmware/central -t upload
; Moniteur série : pio device monitor -d firmware/central
;
; Hypothèse mémoire : 16 Mo de Flash, 8 Mo de PSRAM octale (module N16R8).
; Le firmware de diagnostic lit la taille réelle de la Flash et de la PSRAM :
; si elles diffèrent, ajuster flash_size, partitions et memory_type ci-dessous.

[platformio]
default_envs = guition-4848s040

[env:guition-4848s040]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM
    ; Port série via le convertisseur USB-UART de la carte (pas l'USB natif).
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    '-DBF_FW_VERSION="0.4.0"'
    ; LVGL : configuration dans include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    ; Même correctif que pour la caméra : FS.h introuvable depuis BigFarmCore
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

lib_deps =
    symlink://../common/BigFarmCore
    lvgl/lvgl@8.3.11
    https://github.com/bitbank2/JPEGDEC.git#1.8.2
lib_ldf_mode = chain+

; Mise à jour sans fil (OTA) depuis PlatformIO :
;   pio run -d firmware/central -e guition-4848s040-ota -t upload --upload-port <nom>.local
; (ou l'adresse IP). Mot de passe : bigfarm-setup.
; Autre possibilité : page /maj du module, avec .pio/build/guition-4848s040/firmware.bin.
[env:guition-4848s040-ota]
extends = env:guition-4848s040
upload_protocol = espota
upload_port = bf-central.local
upload_flags =
    --auth=bigfarm-setup
    --port=3232
